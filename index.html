    .directory{min-width:0}.toolbar{position:sticky;top:0;z-index:10;background:rgba(246,244,237,.92);backdrop-filter:blur(14px);border:1px solid rgba(16,37,63,.12);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(16,37,63,.06)}.toolbar-top{display:flex}.search{width:100%;min-width:160px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;color:var(--ink);outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,107,135,.12)}.tabs,.people-filters{display:flex;gap:8px;margin-top:10px;overflow:auto;padding-bottom:1px}.tab,.people-filter{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.people-filters{padding-top:10px;border-top:1px solid rgba(16,37,63,.10)}.people-filter[aria-pressed="true"]{background:var(--rabbit);border-color:var(--rabbit);color:#fff}.result-note{display:flex;justify-content:space-between;gap:16px;margin:18px 4px 10px;color:var(--muted);font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;border:1px solid rgba(16,37,63,.11);border-radius:18px;background:var(--card);padding:0;overflow:hidden;text-align:left;color:inherit;cursor:pointer;box-shadow:0 8px 24px rgba(16,37,63,.05);transition:.22s ease}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow);outline:none;border-color:rgba(16,37,63,.26)}.portrait{aspect-ratio:4/3;background:#dde5e9;overflow:hidden;position:relative}.portrait img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,#dbe8eb,#efe8cf);font-family:"Noto Serif SC","Songti SC",serif;font-size:3rem;color:var(--ink)}.card-body{padding:15px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.card h3{font-family:"Noto Serif SC","Songti SC",serif;font-size:1.18rem;margin:0;line-height:1.35}.dept-dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:0 0 auto;background:var(--blue)}.card[data-dept="秘书处"] .dept-dot{background:var(--coral)}.card[data-dept="咸鱼部"] .dept-dot{background:var(--green)}.role{margin:5px 0 0;color:var(--muted);font-size:.87rem;min-height:2.8em}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{font-size:.78rem;line-height:1;border-radius:999px;padding:7px 9px;background:#edf2f5;color:var(--ink)}.empty{display:none;border:1px dashed rgba(16,37,63,.25);border-radius:18px;padding:50px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.6)}
    dialog{width:min(820px,calc(100% - 24px));max-height:88vh;border:0;border-radius:24px;padding:0;overflow:hidden;color:var(--ink);box-shadow:0 30px 90px rgba(8,22,37,.35)}dialog::backdrop{background:rgba(9,22,35,.62);backdrop-filter:blur(4px)}.dialog-grid{display:grid;grid-template-columns:minmax(280px,42%) 1fr;height:min(720px,88vh);min-height:0}.dialog-media{position:relative;min-height:0;background:#101c2b;display:grid;place-items:center;overflow:hidden}.dialog-media.has-photo::before{content:"";position:absolute;inset:-24px;background:var(--dialog-photo) center/cover no-repeat;filter:blur(20px);opacity:.38;transform:scale(1.08)}.dialog-media.has-photo::after{content:"";position:absolute;inset:0;z-index:1;background:var(--dialog-photo) center/contain no-repeat}.dialog-media.has-photo img{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.dialog-media .placeholder{position:relative;z-index:1}.dialog-content{padding:28px;overflow-y:auto}.close{position:absolute;right:14px;top:14px;z-index:2;border:0;border-radius:50%;width:38px;height:38px;background:rgba(255,255,255,.92);color:var(--ink);font-size:1.35rem;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.12)}.dialog-dept{font-size:.82rem;color:var(--blue);font-weight:800;letter-spacing:.1em}.dialog-content h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:2rem;line-height:1.2;margin:5px 0}.dialog-role{margin:0;color:var(--muted)}.section{margin-top:22px}.section h3{font-size:.88rem;letter-spacing:.1em;margin:0 0 6px;color:var(--muted)}.section p{margin:0;white-space:pre-wrap}.work-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.work-gallery a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#edf2f5}.work-gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .2s ease}.work-gallery a:hover img,.work-gallery a:focus-visible img{transform:scale(1.025)}.footer{padding:18px 0 36px;color:var(--muted);font-size:.85rem;text-align:center}

      <div class="teacher-body"><div class="kicker">指导老师</div><h2>曾老狮</h2><p>珞珈心源指导老狮，理事会幕僚，心源小友们成长的促进者和见证者。生命旅行者和体验者，修行者，喜欢品尝鲜美的灵魂和美食。高敏感 I 人，偏好深度联结。爱好包括游戏、动漫、电影、种菜、看水草生产氧气、看长臂猿爬树、撸猫。</p><p class="motto">“行至艰难处，正是修行时。”</p></div>
    </article>

  <script>

    const grid = document.querySelector('#memberGrid');
    const empty = document.querySelector('#empty');
    const resultCount = document.querySelector('#resultCount');
    const dialog = document.querySelector('#profileDialog');

    function initials(name){ return [...name.replace(/（.*?）|\(.*?\)/g,'').trim()].slice(0,2).join(''); }
    function makePortrait(member, large=false){
      if(member.photo){ const img=document.createElement('img'); img.src=member.photo; img.alt=`${member.name}的照片`; img.loading=large?'eager':'lazy'; return img; }
      const div=document.createElement('div'); div.className='placeholder'; div.textContent=initials(member.name); return div;
    }
    function addTag(container, text, cls=''){ const span=document.createElement('span'); span.className=`tag ${cls}`; span.textContent=text; container.append(span); }
    function openProfile(member){
      const media=document.querySelector('#dialogMedia'); media.replaceChildren(makePortrait(member,true));
      media.classList.toggle('has-photo',Boolean(member.photo));
      media.style.setProperty('--dialog-photo',member.photo?`url("${member.photo}")`:'none');
      document.querySelector('#dialogDept').textContent=`${member.department} · ${member.isOld?'老成员':'新成员'}`;
      document.querySelector('#dialogName').textContent=member.name;
      document.querySelector('#dialogRole').textContent=member.role;
      fillWorkSection(member);
      fillSection('#dialogMentor','对新人的意愿',member.mentor?member.mentorIntent||'':'');
      fillSection('#dialogBio','关于我',member.bio);
      fillSection('#dialogMotto','宣言',member.motto||'');
      dialog.showModal();
    }
    function fillSection(selector,title,text){ const el=document.querySelector(selector); el.replaceChildren(); el.hidden=!text; if(!text)return; const h=document.createElement('h3'); h.textContent=title; const p=document.createElement('p'); p.textContent=text; el.append(h,p); }
    function fillWorkSection(member){ const el=document.querySelector('#dialogWork'); const images=member.workImages||[]; const title=member.isOld?(images.length?'在心源的工作（点击查看作品截图）':'在心源的工作'):(images.length?'想从事的工作（点击查看作品截图）':'想从事的工作'); el.replaceChildren(); el.hidden=!member.work&&!images.length; if(el.hidden)return; const h=document.createElement('h3'); h.textContent=title; el.append(h); if(member.work){const p=document.createElement('p');p.textContent=member.work;el.append(p)} if(images.length){const gallery=document.createElement('div');gallery.className='work-gallery';images.forEach((src,index)=>{const link=document.createElement('a');link.href=src;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label',`查看${member.name}的作品截图${index+1}`);const img=document.createElement('img');img.src=src;img.alt=`${member.name}的作品截图${index+1}`;img.loading='lazy';link.append(img);gallery.append(link)});el.append(gallery)} }
    function cardFor(member){
      const card=document.createElement('button'); card.className='card'; card.type='button'; card.dataset.dept=member.department; card.setAttribute('aria-label',`查看${member.name}的介绍`); card.addEventListener('click',()=>openProfile(member));
      const portrait=document.createElement('div'); portrait.className='portrait'; portrait.append(makePortrait(member));
      const body=document.createElement('div'); body.className='card-body'; const head=document.createElement('div'); head.className='card-head'; const title=document.createElement('h3'); title.textContent=member.name; const dot=document.createElement('i'); dot.className='dept-dot'; dot.setAttribute('aria-hidden','true'); head.append(title,dot);
      const role=document.createElement('p'); role.className='role'; role.textContent=member.role;
      const tags=document.createElement('div'); tags.className='tags'; addTag(tags,member.department); if(!member.isOld)addTag(tags,'新成员');
      body.append(head,role,tags); card.append(portrait,body); return card;
    }
    function render(){
      const q=state.query.trim().toLowerCase();
      const filtered=members.filter(m=>(state.department==='全部'||m.department===state.department)&&(state.audience==='all'||(state.audience==='mentor'&&m.mentor)||(state.audience==='new'&&!m.isOld))&&(!q||[m.name,m.role,m.work,m.bio,m.mentorIntent||''].join(' ').toLowerCase().includes(q)));
      grid.replaceChildren(...filtered.map(cardFor)); empty.style.display=filtered.length?'none':'block'; resultCount.textContent=`找到 ${filtered.length} 位伙伴`;
    }
    document.querySelector('#search').addEventListener('input',e=>{state.query=e.target.value;render()});
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{state.department=tab.dataset.dept;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t===tab));render()}));
    document.querySelectorAll('.people-filter').forEach(button=>button.addEventListener('click',()=>{state.audience=state.audience===button.dataset.audience?'all':button.dataset.audience;document.querySelectorAll('.people-filter').forEach(item=>item.setAttribute('aria-pressed',state.audience===item.dataset.audience));render()}));
    document.querySelector('.close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    render();
  </script>
</body>
</html>
